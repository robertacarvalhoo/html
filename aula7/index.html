<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 7 - Tabelas</title>
</head>
<body>
    <table style="border: 1px 
    solid black;
    border-collapse: collapse;">
       
       <tr>
        <td colspan="3" 
        style="border: 1px
        solid black;
        border-collapse: collapse;
        text-align:center;
        background-color: #e3cfcf; color: rgb(0, 0, 0)">Tabela de Exemplo</td>
        </tr>
            <th style="border: 1px 
    solid black;
    border-collapse: collapse;">Nome</th>
            <th style="border: 1px 
    solid black;
    border-collapse: collapse;">Idade</th>
            <th style="border: 1px 
    solid black;
    border-collapse: collapse;">Cidade</th>
        </tr style="border: 1px 
    solid black;
    border-collapse: collapse;">
        
        <tr style="border: 1px 
    solid black;
    border-collapse: collapse;">
            <td style="border: 1px 
    solid black;
    border-collapse: collapse;">João</td>
            <td style="border: 1px 
    solid black;
    border-collapse: collapse;">25</td>
            <td style="border: 1px 
    solid black;
    border-collapse: collapse;">São Paulo</td>
        </tr>

    </table>
</body>
</html>
